<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 10 140 145" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="botBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="botScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glow Backlight -->
  <circle cx="100" cy="85" r="75" fill="url(#bgGlow)"/>

  <!-- Antenna -->
  <path d="M 100 45 L 100 28" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="22" r="8" fill="#06b6d4" filter="url(#cyanGlow)"/>
  <path d="M 96 22 L 98 20 L 100 24 L 102 22 L 104 22" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ears -->
  <rect x="36" y="70" width="10" height="20" rx="4" fill="#0284c7"/>
  <rect x="154" y="70" width="10" height="20" rx="4" fill="#0284c7"/>

  <!-- Head Frame -->
  <rect x="42" y="42" width="116" height="84" rx="28" fill="url(#botBody)" stroke="#475569" stroke-width="3"/>

  <!-- Face Screen -->
  <rect x="52" y="52" width="96" height="64" rx="20" fill="url(#botScreen)"/>

  <!-- Glowing Eyes -->
  <ellipse cx="78" cy="80" rx="11" ry="14" fill="#38bdf8" filter="url(#cyanGlow)"/>
  <ellipse cx="122" cy="80" rx="11" ry="14" fill="#38bdf8" filter="url(#cyanGlow)"/>

  <!-- Eye Reflections -->
  <circle cx="82" cy="74" r="4" fill="#ffffff"/>
  <circle cx="75" cy="84" r="2" fill="#ffffff"/>
  <circle cx="126" cy="74" r="4" fill="#ffffff"/>
  <circle cx="119" cy="84" r="2" fill="#ffffff"/>

  <!-- Blush -->
  <ellipse cx="68" cy="94" rx="6" ry="3" fill="#f43f5e" opacity="0.4"/>
  <ellipse cx="132" cy="94" rx="6" ry="3" fill="#f43f5e" opacity="0.4"/>

  <!-- Smile -->
  <path d="M 92 90 Q 100 98 108 90" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#cyanGlow)"/>

  <!-- Body Collar -->
  <path d="M 70 128 L 130 128 L 122 152 L 78 152 Z" fill="url(#botBody)" stroke="#475569" stroke-width="2.5"/>
  <path d="M 90 138 L 110 138" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" filter="url(#cyanGlow)"/>
</svg>
